<svg viewBox="0 0 1000 460" xmlns="http://www.w3.org/2000/svg" font-family="Instrument Sans, Arial, sans-serif">
  <rect width="1000" height="460" fill="#f4f5f7"/>
  <!-- Left: your systems -->
  <rect x="40" y="150" width="210" height="160" rx="14" fill="#ffffff" stroke="#d7dbe3"/>
  <text x="145" y="180" text-anchor="middle" font-size="17" font-weight="700" fill="#1f2430">Your systems</text>
  <text x="145" y="212" text-anchor="middle" font-size="15" fill="#5a6a8a">POS</text>
  <text x="145" y="240" text-anchor="middle" font-size="15" fill="#5a6a8a">ERP</text>
  <text x="145" y="268" text-anchor="middle" font-size="15" fill="#5a6a8a">Database (SQL)</text>
  <text x="145" y="296" text-anchor="middle" font-size="15" fill="#5a6a8a">or a spreadsheet</text>

  <!-- Middle: three method lanes -->
  <g font-size="14" font-weight="700">
    <rect x="360" y="70" width="280" height="70" rx="12" fill="#eaf0ff" stroke="#b9c8ef"/>
    <text x="500" y="100" text-anchor="middle" fill="#1f3a7a" font-size="15">1 · API (REST)</text>
    <text x="500" y="122" text-anchor="middle" fill="#5a6a8a" font-size="12.5" font-weight="400">Standard, stable, easy to maintain</text>

    <rect x="360" y="195" width="280" height="70" rx="12" fill="#eaf0ff" stroke="#b9c8ef"/>
    <text x="500" y="225" text-anchor="middle" fill="#1f3a7a" font-size="15">2 · MQTT (broadcast)</text>
    <text x="500" y="247" text-anchor="middle" fill="#5a6a8a" font-size="12.5" font-weight="400">Real-time, many updates at once</text>

    <rect x="360" y="320" width="280" height="70" rx="12" fill="#eaf0ff" stroke="#b9c8ef"/>
    <text x="500" y="350" text-anchor="middle" fill="#1f3a7a" font-size="15">3 · Direct database</text>
    <text x="500" y="372" text-anchor="middle" fill="#5a6a8a" font-size="12.5" font-weight="400">For old systems with no API (read-only)</text>
  </g>

  <!-- Right: AiESL + labels -->
  <rect x="750" y="150" width="210" height="160" rx="14" fill="#4d7cff"/>
  <text x="855" y="200" text-anchor="middle" font-size="17" font-weight="700" fill="#ffffff">AiESL platform</text>
  <text x="855" y="228" text-anchor="middle" font-size="13" fill="#dbe6ff">gateway + software</text>
  <text x="855" y="262" text-anchor="middle" font-size="15" font-weight="700" fill="#ffffff">&#8595;</text>
  <text x="855" y="290" text-anchor="middle" font-size="14" fill="#ffffff">e-paper shelf labels</text>

  <!-- arrows left->lanes -->
  <g stroke="#9fb0d6" stroke-width="2" fill="none" marker-end="url(#a)">
    <path d="M250 205 C 310 205, 300 105, 360 105"/>
    <path d="M250 230 L 360 230"/>
    <path d="M250 255 C 310 255, 300 355, 360 355"/>
  </g>
  <!-- arrows lanes->AiESL -->
  <g stroke="#9fb0d6" stroke-width="2" fill="none" marker-end="url(#a)">
    <path d="M640 105 C 700 105, 700 205, 750 210"/>
    <path d="M640 230 L 750 235"/>
    <path d="M640 355 C 700 355, 700 260, 750 260"/>
  </g>
  <defs>
    <marker id="a" markerWidth="9" markerHeight="9" refX="7" refY="4" orient="auto">
      <path d="M0 0 L8 4 L0 8 z" fill="#9fb0d6"/>
    </marker>
  </defs>
  <text x="500" y="435" text-anchor="middle" font-size="13" fill="#7a869c">Three ways your data reaches the shelf edge — pick the one that matches what you already have.</text>
</svg>

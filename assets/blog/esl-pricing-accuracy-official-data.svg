<svg xmlns="http://www.w3.org/2000/svg" width="1700" height="762" viewBox="0 0 1700 762" role="img" aria-labelledby="title desc">
  <title id="title">US price-verification inspection results, 1996 to 2024</title>
  <desc id="desc">Two charts show stores passing the 98 percent price-accuracy standard and 2024 item-level pricing error rates by store type.</desc>
  <rect width="1700" height="762" fill="#ffffff"/>
  <style>
    .title{font:700 28px Arial,Segoe UI,sans-serif;fill:#111827}
    .axis,.label{font:16px Arial,Segoe UI,sans-serif;fill:#5b6577}
    .small{font:14px Arial,Segoe UI,sans-serif;fill:#5b6577}
    .value{font:700 24px Arial,Segoe UI,sans-serif;fill:#111827}
    .red{fill:#e35a3d}.blue{fill:#4d7cff}.deep{fill:#315bdc}
    .grid{stroke:#dbe2ec;stroke-width:1}.axisline{stroke:#cfd7e3;stroke-width:1.4}
    .limit{stroke:#111827;stroke-width:3;stroke-dasharray:8 7}
  </style>

  <text class="title" x="70" y="40">Stores passing the 98% price-accuracy standard</text>
  <g transform="translate(110 70)">
    <line class="axisline" x1="0" y1="0" x2="0" y2="450"/>
    <line class="axisline" x1="0" y1="450" x2="545" y2="450"/>
    <g class="grid">
      <line x1="0" y1="0" x2="545" y2="0"/><line x1="0" y1="90" x2="545" y2="90"/>
      <line x1="0" y1="180" x2="545" y2="180"/><line x1="0" y1="270" x2="545" y2="270"/>
      <line x1="0" y1="360" x2="545" y2="360"/>
    </g>
    <g class="axis">
      <text x="-14" y="5" text-anchor="end">100%</text><text x="-14" y="95" text-anchor="end">80%</text>
      <text x="-14" y="185" text-anchor="end">60%</text><text x="-14" y="275" text-anchor="end">40%</text>
      <text x="-14" y="365" text-anchor="end">20%</text><text x="-14" y="455" text-anchor="end">0%</text>
    </g>
    <text class="axis" transform="translate(-72 248) rotate(-90)" text-anchor="middle">% of inspections passing EPPV</text>
    <rect class="blue" x="24" y="247.5" width="120" height="202.5"/><text class="value" x="84" y="235" text-anchor="middle">45%</text>
    <rect class="blue" x="220" y="130.5" width="120" height="319.5"/><text class="value" x="280" y="118" text-anchor="middle">71%</text>
    <rect class="deep" x="416" y="103.5" width="120" height="346.5"/><text class="value" x="476" y="91" text-anchor="middle">77%</text>
    <g class="axis">
      <text x="84" y="478" text-anchor="middle">1996</text><text x="84" y="500" text-anchor="middle">FTC</text>
      <text x="280" y="478" text-anchor="middle">1998</text><text x="280" y="500" text-anchor="middle">FTC</text>
      <text x="476" y="478" text-anchor="middle">2024</text><text x="476" y="500" text-anchor="middle">NCWM</text>
    </g>
    <g class="small">
      <text x="84" y="540" text-anchor="middle">1 in 21 items</text><text x="84" y="562" text-anchor="middle">priced wrong</text>
      <text x="280" y="540" text-anchor="middle">1 in 30 items</text><text x="280" y="562" text-anchor="middle">priced wrong</text>
      <text x="476" y="540" text-anchor="middle">1 in 43 items</text><text x="476" y="562" text-anchor="middle">priced wrong</text>
    </g>
  </g>

  <text class="title" x="980" y="40">2024: share of items priced incorrectly, by store type</text>
  <g transform="translate(965 70)">
    <g class="grid">
      <line x1="0" y1="0" x2="0" y2="450"/><line x1="120" y1="0" x2="120" y2="450"/>
      <line x1="240" y1="0" x2="240" y2="450"/><line x1="360" y1="0" x2="360" y2="450"/>
      <line x1="480" y1="0" x2="480" y2="450"/><line x1="600" y1="0" x2="600" y2="450"/><line x1="720" y1="0" x2="720" y2="450"/>
    </g>
    <line class="limit" x1="240" y1="25" x2="240" y2="430"/><text class="value" x="175" y="17">2% EPPV limit</text>
    <g class="label" text-anchor="end">
      <text x="-12" y="66">Convenience</text><text x="-12" y="104">Dollar/Discount</text><text x="-12" y="142">Automotive</text>
      <text x="-12" y="180">Big Box/Department</text><text x="-12" y="218">Home Center</text><text x="-12" y="256">Drug/Pharmacy</text>
      <text x="-12" y="294">Supercenter</text><text x="-12" y="332">Grocery/Supermarket</text><text x="-12" y="370">Other</text>
      <text x="-12" y="408">Clothing</text><text x="-12" y="446">Warehouse/Club</text>
    </g>
    <rect class="red" x="0" y="44" width="588" height="24"/><text class="value" x="604" y="64">4.9%</text>
    <rect class="red" x="0" y="82" width="420" height="24"/><text class="value" x="436" y="102">3.5%</text>
    <rect class="red" x="0" y="120" width="372" height="24"/><text class="value" x="388" y="140">3.1%</text>
    <rect class="red" x="0" y="158" width="252" height="24"/><text class="value" x="268" y="178">2.1%</text>
    <rect class="red" x="0" y="196" width="252" height="24"/><text class="value" x="268" y="216">2.1%</text>
    <rect class="blue" x="0" y="234" width="228" height="24"/><text class="value" x="244" y="254">1.9%</text>
    <rect class="blue" x="0" y="272" width="216" height="24"/><text class="value" x="232" y="292">1.8%</text>
    <rect class="blue" x="0" y="310" width="204" height="24"/><text class="value" x="220" y="330">1.7%</text>
    <rect class="blue" x="0" y="348" width="204" height="24"/><text class="value" x="220" y="368">1.7%</text>
    <rect class="blue" x="0" y="386" width="132" height="24"/><text class="value" x="148" y="406">1.1%</text>
    <rect class="blue" x="0" y="424" width="108" height="24"/><text class="value" x="124" y="444">0.9%</text>
    <g class="axis" text-anchor="middle">
      <text x="0" y="478">0.0%</text><text x="120" y="478">1.0%</text><text x="240" y="478">2.0%</text>
      <text x="360" y="478">3.0%</text><text x="480" y="478">4.0%</text><text x="600" y="478">5.0%</text><text x="720" y="478">6.0%</text>
    </g>
    <text class="axis" x="360" y="508" text-anchor="middle">% of checked items where shelf price != price charged</text>
  </g>

  <text x="38" y="655" font-family="Arial,Segoe UI,sans-serif" font-size="21" font-weight="700" fill="#e35a3d">Accuracy has improved for 30 years - and 23% of stores still fail.</text>
  <text class="small" x="120" y="732">Sources: FTC Price Check (1996, 17,928 items) and Price Check II (1998, 107,096 items); 2024 NCWM National Price Verification Survey (419,237 items, 7,462 inspections, 26 states).</text>
  <text class="small" x="350" y="756" font-style="italic">2024 item-level rate is a weighted average calculated from the survey's per-store-type table; the other two are as published.</text>
</svg>
